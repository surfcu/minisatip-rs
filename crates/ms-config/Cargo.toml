[package]
name = "ms-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Reflects whether the binary was built with SRT support.
srt = []
# Netceiver client (C++ NETCVCLIENT): without it `-n`/`--netceiver` are unknown options.
# Netceiver is parked (PLAN §3), so the binary never enables it.
netceiver = []

[dependencies]
ms-log = { path = "../ms-log" }

[lints]
workspace = true
