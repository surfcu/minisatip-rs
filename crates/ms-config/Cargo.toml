[package]
name = "ms-config"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Selects the s2api version in the banner (C++ LINUXDVB builds).
linux-dvb = []
# Diagnostics options: --log-remote, --log-remote-queue and --log-ring.
diag-log = ["ms-log/diag-log"]
# Reflects whether the binary was built with SRT support.
srt = []
# Netceiver client (C++ NETCVCLIENT): without it `-n`/`--netceiver` are unknown options.
# Netceiver is parked (PLAN §3), so the binary never enables it.
netceiver = []

[dependencies]
ms-log = { path = "../ms-log" }

[build-dependencies]
libc = "0.2"

[lints]
workspace = true
