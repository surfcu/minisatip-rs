[package]
name = "ms-net"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# SRT output support; links libsrt (through ms-srt) only when enabled.
srt = ["dep:ms-srt", "ms-srt/srt"]
# Diagnostic events; enables the call-site tests that check them.
diag-log = ["ms-log/diag-log"]

[dependencies]
libc = "0.2"
ms-log = { path = "../ms-log" }
ms-sched = { path = "../ms-sched" }
ms-srt = { path = "../ms-srt", optional = true }
ms-tuner = { path = "../ms-tuner" }
ms-ts = { path = "../ms-ts" }

[lints]
workspace = true
