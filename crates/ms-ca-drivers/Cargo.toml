[package]
name = "ms-ca-drivers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# DVB-CSA via libdvbcsa (C++ CMake option DVBCSA); links -ldvbcsa.
dvbcsa = []
# iCAM CSA: needs a libdvbcsa that exports dvbcsa_bs_key_set_ecm.
dvbcsa-icam = ["dvbcsa"]

[dependencies]
ms-ca = { path = "../ms-ca" }
ms-config = { path = "../ms-config" }
ms-ts = { path = "../ms-ts" }

[dev-dependencies]
ms-psi = { path = "../ms-psi" }

[lints]
workspace = true
