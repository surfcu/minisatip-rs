[package]
name = "minisatip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["linux-dvb"]
# Builds with SRT support.
srt = ["ms-config/srt", "ms-net/srt", "ms-tuner/srt"]
# Enables the Linux DVB tuner backend and /dev/dvb enumeration.
linux-dvb = ["ms-tuner/linux-dvb"]
# DVB-CSA software descrambling through libdvbcsa.
dvbcsa = ["ms-ca-drivers/dvbcsa"]
# iCAM CSA: needs a libdvbcsa that exports dvbcsa_bs_key_set_ecm.
dvbcsa-icam = ["dvbcsa", "ms-ca-drivers/dvbcsa-icam"]
# Netceiver adapters (`-n`) through libnetceiver (C++ NETCVCLIENT).
netceiver = ["ms-tuner/netceiver", "ms-config/netceiver"]

[dependencies]
libc = "0.2"
ms-ca = { path = "../ms-ca" }
ms-ca-drivers = { path = "../ms-ca-drivers" }
ms-config = { path = "../ms-config" }
ms-log = { path = "../ms-log" }
ms-net = { path = "../ms-net" }
ms-psi = { path = "../ms-psi" }
ms-sched = { path = "../ms-sched" }
ms-ts = { path = "../ms-ts" }
ms-tuner = { path = "../ms-tuner" }

[dev-dependencies]
ms-fakecam = { path = "../ms-fakecam" }

[lints]
workspace = true
