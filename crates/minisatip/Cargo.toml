[package]
name = "minisatip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["linux-dvb"]
# Builds with SRT support.
srt = ["ms-config/srt", "ms-net/srt", "ms-tuner/srt"]
# Enables the Linux DVB tuner backend and /dev/dvb enumeration.
linux-dvb = ["ms-tuner/linux-dvb"]

[dependencies]
libc = "0.2"
ms-config = { path = "../ms-config" }
ms-net = { path = "../ms-net" }
ms-sched = { path = "../ms-sched" }
ms-tuner = { path = "../ms-tuner" }

[lints]
workspace = true
