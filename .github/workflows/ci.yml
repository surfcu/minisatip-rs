name: CI

on:
  push:
    branches:
      - main
      - "rs/**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, clippy and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # An iCAM-capable libdvbcsa is not on the runners: check without linking.
      - name: Check iCAM CSA feature
        run: cargo check -p minisatip --features dvbcsa-icam

  test-ci-plus:
    name: Tests with CI+ content control
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Check CI+ feature
        run: cargo check -p minisatip --features ci-plus

      - name: Clippy
        run: |
          cargo clippy -p ms-ca-drivers --all-targets --features ci-plus,ms-fakecam/ci-plus -- -D warnings
          cargo clippy -p minisatip --all-targets --features ci-plus,ms-fakecam/ci-plus -- -D warnings

      # The CI+ protocol tests need the fake CAM's ci-plus feature too; both are always passed.
      - name: Tests
        run: |
          cargo test -p ms-ca-drivers --features ci-plus,ms-fakecam/ci-plus
          cargo test -p minisatip --features ci-plus,ms-fakecam/ci-plus

      - name: Tests with diag-log
        run: |
          cargo test -p ms-ca-drivers --features ci-plus,ms-fakecam/ci-plus,ms-ca-drivers/diag-log
          cargo test -p minisatip --features diag-log,ci-plus

  diag-log:
    name: Tests with diag-log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Build
        run: cargo build -p minisatip --features diag-log

      - name: Clippy
        run: |
          cargo clippy -p minisatip -p ms-log -p ms-config -p ms-net -p ms-sched -p ms-ca-drivers --all-targets --features ms-log/diag-log,ms-config/diag-log,ms-net/diag-log,ms-ca-drivers/diag-log,minisatip/diag-log -- -D warnings

      # The call-site tests live in several crates; each crate's own feature
      # enables the tests that check its events.
      - name: Tests
        run: |
          cargo test -p ms-log -p ms-config -p ms-net -p ms-sched -p ms-ca-drivers -p minisatip --features ms-log/diag-log,ms-config/diag-log,ms-net/diag-log,ms-ca-drivers/diag-log,minisatip/diag-log

  dvbcsa:
    name: Tests with dvbcsa (CSA descrambling, ca_e2e)
    # libdvbcsa-dev has this name on Ubuntu 24.04 and 26.04.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libdvbcsa
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdvbcsa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Clippy
        run: cargo clippy --workspace --all-targets --features ms-ca-drivers/dvbcsa,minisatip/dvbcsa -- -D warnings

      - name: Tests
        run: cargo test --workspace --features ms-ca-drivers/dvbcsa,minisatip/dvbcsa

  harness:
    name: Differential harness (Rust vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build servers and harness
        run: cargo build -p minisatip -p ms-harness

      # Fast scenarios only; ten runs prove the transcripts are deterministic.
      - name: Run scenarios
        run: cargo run -q -p ms-harness -- run --fast --runs 10

  cross:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            toolchain: stable
            build_std: false
            experimental: false
          - target: armv7-unknown-linux-musleabihf
            toolchain: stable
            build_std: false
            experimental: false
          - target: aarch64-unknown-linux-musl
            toolchain: stable
            build_std: false
            experimental: false
          # mipsel is tier 3: no prebuilt std, so nightly + build-std only.
          # Cross images/toolchains for it are best-effort, hence allowed to fail.
          - target: mipsel-unknown-linux-musl
            toolchain: nightly
            build_std: true
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable targets)
        if: ${{ !matrix.build_std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: ${{ matrix.target }}

      - name: Install Rust (nightly + rust-src for build-std)
        if: ${{ matrix.build_std }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rust-src

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (stable targets)
        if: ${{ !matrix.build_std }}
        run: cross build --release -p minisatip --target ${{ matrix.target }}

      # The diagnostics code must also compile for the 32-bit target.
      - name: Check diag-log (armv7)
        if: ${{ matrix.target == 'armv7-unknown-linux-musleabihf' }}
        run: cargo check -p minisatip --features diag-log --target armv7-unknown-linux-musleabihf

      - name: Build (tier-3 target, nightly + build-std)
        if: ${{ matrix.build_std }}
        run: >-
          cross +nightly build -Zbuild-std=std,panic_abort
          --release -p minisatip --target ${{ matrix.target }}

      # Static OpenSSL for the CI+ crypto known-answer tests.
      - name: Test CI+ crypto (musl)
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: >-
          cross test -p ms-ca-drivers --features ci-plus-vendored,ms-fakecam/ci-plus
          --target x86_64-unknown-linux-musl ciplus::certs

      - name: Report stripped binary size
        run: |
          binary="target/${{ matrix.target }}/release/minisatip"
          size=$(stat -c '%s' "$binary")
          echo "${{ matrix.target }}: ${size} bytes"
          {
            echo "### ${{ matrix.target }}"
            echo ""
            echo "Stripped binary: **${size} bytes**"
          } >> "$GITHUB_STEP_SUMMARY"

  cpp-reference:
    name: Differential harness (C++ vs Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libssl-dev libdvbcsa-dev libxml2-dev zlib1g-dev cmake

      # The baseline commit plus harness/cpp-replay.patch, as built locally. The
      # ref is pinned, so a patch that does not apply is a bug here and fails the job.
      - name: Build C++ reference
        id: cpp
        run: scripts/build-cpp-reference.sh target/upstream/minisatip

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minisatip-cpp-reference
          path: target/upstream/minisatip/build-harness/minisatip
          if-no-files-found: error

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build servers and harness
        run: cargo build -p minisatip -p ms-harness

      # Every scenario, three runs each, against the oracle and the goldens.
      - name: Run scenarios
        run: >-
          cargo run -q -p ms-harness -- run --runs 3 --golden harness/golden
          --cpp target/upstream/minisatip/build-harness/minisatip
