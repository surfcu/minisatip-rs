name: emulate-pids-all-after-stream
description: "-k -9: pids=all after an explicit stream with a PMT on the same adapter"
capture: multi
fast: true
args: ["-k", "-9"]
steps:
  - udp: u1
  - rtsp:
      conn: c
      method: SETUP
      url: "{base}/?src=1&freq=11494&pol=h&ro=0.35&msys=dvbs2&mtype=8psk&plts=off&sr=22000&fec=23&pids=0,17,256,257,258"
      headers: { Transport: "RTP/AVP;unicast;client_port={rtp:u1}-{rtcp:u1}" }
  - rtsp: { conn: c, method: PLAY, url: "{base}/stream={stream:c}", session: true }
  - capture: { from: u1, packets: 2000 }
  - rtsp: { conn: c, method: TEARDOWN, url: "{base}/stream={stream:c}", session: true }
  - sleep: 500
  - udp: u2
  - rtsp:
      conn: d
      method: SETUP
      url: "{base}/?src=1&freq=11494&pol=h&ro=0.35&msys=dvbs2&mtype=8psk&plts=off&sr=22000&fec=23&pids=all"
      headers: { Transport: "RTP/AVP;unicast;client_port={rtp:u2}-{rtcp:u2}" }
  - rtsp: { conn: d, method: PLAY, url: "{base}/stream={stream:d}", session: true }
  - sleep: 1000
  - capture: { from: u2, mode: sets }
  - http: { path: /state.json, body: numbers }
  - rtsp: { conn: d, method: TEARDOWN, url: "{base}/stream={stream:d}", session: true }
