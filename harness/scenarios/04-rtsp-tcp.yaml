name: rtsp-tcp
description: RTP-over-TCP with interleaved framing captured on the RTSP connection
capture: fta
fast: true
steps:
  - rtsp: { conn: c, method: OPTIONS, url: "{base}/" }
  - rtsp:
      conn: c
      method: SETUP
      url: "{base}/?src=1&freq=11494&pol=h&ro=0.35&msys=dvbs2&mtype=8psk&plts=off&sr=22000&fec=23&pids=0,17,256,257"
      headers: { Transport: "RTP/AVP/TCP;interleaved=0-1" }
  - rtsp: { conn: c, method: PLAY, url: "{base}/stream={stream:c}", session: true }
  - capture: { from: c }
  - rtsp: { conn: c, method: TEARDOWN, url: "{base}/stream={stream:c}", session: true }
  - silence: { from: c, ms: 300 }
